<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<section class="card consent">
<div class="icon">📍</div>
<h1>{{ title }}</h1>
<p>Halaman ini meminta izin lokasi perangkat untuk keperluan audit/investigasi yang Anda setujui.</p>
<div id="status" class="status">Meminta izin lokasi...</div>
<p class="small">Browser akan menampilkan dialog izin lokasi. Koordinat hanya dikirim setelah Anda memilih <b>Allow/Izinkan</b>.</p>
<button id="retry" onclick="requestLocation()" hidden>Coba lagi</button>
</section>
</main>

<script>
const statusEl = document.getElementById("status");
const retry = document.getElementById("retry");

async function send(data) {
  const r = await fetch("/api/visit/{{ token }}", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error("Gagal mengirim data");
}

function requestLocation() {
  retry.hidden = true;
  statusEl.textContent = "Meminta izin lokasi dari browser...";

  if (!window.isSecureContext && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
    statusEl.textContent = "Geolocation membutuhkan HTTPS saat diakses melalui jaringan.";
    retry.hidden = false;
    return;
  }

  if (!navigator.geolocation) {
    statusEl.textContent = "Browser tidak mendukung Geolocation API.";
    retry.hidden = false;
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (position) => {
      try {
        await send({
          geo_consent: true,
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          accuracy: position.coords.accuracy
        });
        statusEl.textContent =
          "Lokasi berhasil dikirim setelah izin diberikan. Terima kasih.";
      } catch (e) {
        statusEl.textContent = "Lokasi didapat, tetapi gagal dikirim ke server.";
        retry.hidden = false;
      }
    },
    async (error) => {
      await send({geo_consent:false}).catch(()=>{});
      const messages = {
        1: "Izin lokasi ditolak.",
        2: "Lokasi tidak tersedia.",
        3: "Permintaan lokasi timeout."
      };
      statusEl.textContent = messages[error.code] || "Lokasi tidak dapat diperoleh.";
      retry.hidden = false;
    },
    {enableHighAccuracy:true, timeout:15000, maximumAge:0}
  );
}

// Otomatis meminta izin saat halaman selesai dimuat.
// Tetap tunduk pada permission browser/OS.
window.addEventListener("load", requestLocation);
</script>
</body>
</html>
